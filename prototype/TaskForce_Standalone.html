P.project=id=>{let p=T.project(id);if(!p||!T.visibleProject(p))return P.denied();let ts=T.projectTasks(id),m=T.metrics(ts),tab=T.ui.projectTab||'overview';let body='';if(tab==='overview')body=`<div class="dashboard-grid"><div>${C.card('A shared direction',`<p>${E(p.description)}</p><div class="grid2" style="margin-top:20px"><div><div class="tiny muted">ACCOUNTABLE OWNER</div><div class="row" style="margin-top:10px">${C.avatar(p.owner)}<h3>${E(T.user(p.owner).name)}</h3></div></div><div><div class="tiny muted">PROJECT TEAM</div><div style="margin-top:10px">${C.avatars(p.members)}</div></div></div>`)}${C.card('Milestones that matter',p.milestones.map(m=>`<div class="milestone"><input type="checkbox" data-change="milestone" data-project="${p.id}" data-id="${m.id}" aria-label="Complete ${E(m.title)}" ${m.done?'checked':''} ${!T.canEdit()?'disabled':''}><span class="milestone-title ${m.done?'done-title':''}">${E(m.title)}</span><span class="spacer"></span><span class="tiny muted">${T.date(m.due)}</span></div>`).join(''),C.link('+ Add milestone','milestone-new',{id:p.id}))}${C.card('Recent project activity',C.activity(T.db.activity.filter(a=>a.project===p.id)))}</div><div>${C.card('Project health',C.badge(T.health(p))+`<p style="margin-top:15px">${m.blocked?m.blocked+' blocked tasks require a dependency review.':m.overdue?m.overdue+' overdue tasks require a timeline review.':'No blocked or overdue tasks in this project.'}</p><div style="margin:20px 0 8px">${C.progress(m.rate,p.color)}</div><p class="tiny">${m.done} of ${m.total} eligible tasks complete · ${m.rate}%</p>`)}${C.card('Upcoming work',C.taskTable(ts.filter(t=>!T.isTerminal(t)).slice(0,4),{compact:true}))}</div></div>`;if(tab==='tasks')body=C.card('Project task register',C.taskTable(ts),C.btn('Create task','task-new','plus','soft',{project:p.id}));if(tab==='board')body=C.board(ts,p.id);if(tab==='timeline')body=C.card('Delivery timeline',C.timeline(ts),'','','Task start dates and deadlines from the project regist document.addEventListener('click',e=>{let el=e.target.closest('[data-action]');if(el){let handler=A[el.dataset.action];if(handler){e.preventDefault();try{handler(el.dataset,el)}catch(err){console.error(err);T.toast('That action could not be completed. Please try again.','warning')}}return}if(e.target.dataset.dismiss==='modal')T.closeModal();if(e.target.dataset.dismiss==='drawer')T.closeDrawer()});
document.addEventListener('submit',e=>{let form=e.target.closest('[data-form]');if(!form)return;e.preventDefault();let v=Object.fromEntries(new FormData(form)),fn=F[form.dataset.form];if(!fn)return;try{fn(v,form.dataset.id)}catch(err){let error=$('#form-error');if(error)error.textContent=err.message;else T.toast(err.message,'warning')}});
let searchTimer;
T.renderKeepingInput=(kind)=>{const input=document.querySelector('[data-input="'+kind+'"]');const pos=input?.selectionStart;T.render();const replacement=document.querySelector('[data-input="'+kind+'"]');replacement?.focus();if(pos!==null&&pos!==undefined)replacement?.setSelectionRange(pos,pos)};
document.addEventListener('input',e=>{let d=e.target.dataset;if(d.input==='command')$('#command-results').innerHTML=T.commandResults(e.target.value);if(d.input==='task-search'){(T.ui.filters[T.ui.route]??={}).query=e.target.value;clearTimeout(searchTimer);searchTimer=setTimeout(()=>T.renderKeepingInput('task-search'),180)}if(d.input==='project-search'){(T.ui.filters.projects??={}).query=e.target.value;clearTimeout(searchTimer);searchTimer=setTimeout(()=>T.renderKeepingInput('project-search'),180)}});

document.addEventListener('change',e=>{let d=e.target.dataset,v=e.target.value,t;switch(d.change){case 'filter':{let f=T.ui.filters[T.ui.route]??={};f[d.key]=v;f.onlyOpen=false;f.attention=false;T.render();break}case 'project-health':(T.ui.filters.projects??={}).health=v;T.render();break;case 'board-project':T.ui.boardProject=v;T.render();break;case 'calendar-scope':T.ui.tabs.calendar=v;T.render();break;case 'report-period':T.ui.reportPeriod=v;T.render();break;case 'report-dept':T.ui.reportDept=v;T.render();break;case 'task-status':T.updateTask(d.id,{status:v});break;case 'checklist':t=T.task(d.id);T.commit('Updated checklist step',()=>t.checklist[+d.index].done=e.target.checked,t.project);break;case 'milestone':T.commit('Updated project milestone',()=>T.project(d.project).milestones.find(m=>m.id===d.id).done=e.target.checked,d.project);break;case 'onboarding':T.commit('Updated onboarding checklist',()=>T.db.onboarding.find(o=>o.id===d.id).done=e.target.checked);break;case 'hiring-stage':T.commit('Updated hiring stage',()=>T.db.hiring.find(h=>h.id===d.id).stage=v);break;case 'member-role':T.commit('Updated demo member role',()=>T.user(d.id).role=v);break;case 'mail-filter':T.ui.mailFilter=v;T.ui.mailId=null;T.render();break;case 'density':T.db.preferences.density=v;T.persist();T.render();break;case 'reference-date':if(/^\d{4}-\d{2}-\d{2}$/.test(v)){T.db.preferences.referenceDate=v;T.persist();T.render()}break;case 'select-task':e.target.checked?T.ui.selected.add(d.id):T.ui.selected.delete(d.id);T.render();break;case 'select-all':(T.ui.currentTasks||[]).forEach(t=>e.target.checked?T.ui.selected.add(t.id):T.ui.selected.delete(t.id));T.render();break}});
document.addEventListener('dragstart',e=>{let card=e.target.closest('[data-drag]');if(!card||!T.canEdit())return;e.dataTransfer.setData('text/plain',card.dataset.drag);e.dataTransfer.effectAllowed='move';card.classList.add('dragging')});document.addEventListener('dragend',()=>document.querySelectorAll('.dragging,.drag-over').forEach(el=>el.classList.remove('dragging','drag-over')));document.addEventListener('dragover',e=>{let lane=e.target.closest('[data-drop]');if(lane){e.preventDefault();lane.classList.add('drag-over')}});document.addEventListener('dragleave',e=>{let lane=e.target.closest('[data-drop]');if(lane&&!lane.contains(e.relatedTarget))lane.classList.remove('drag-over')});document.addEventListener('drop',e=>{let lane=e.target.closest('[data-drop]');if(!lane)return;e.preventDefault();let id=e.dataTransfer.getData('text/plain');if(T.task(id))T.updateTask(id,{status:lane.dataset.drop})});
document.addEventListener('keydown',e=>{let editing=['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName);if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();T.openCommand()}if(e.key==='Escape'){if(T.ui.modal)T.closeModal();else if(T.ui.drawer)T.closeDrawer();else if(T.ui.mobile){T.ui.mobile=false;T.render()}}if(e.key.toLowerCase()==='n'&&!editing&&!T.ui.modal&&!T.ui.drawer){e.preventDefault();T.openTaskForm()}if(e.key==='Tab'&&(T.ui.modal||T.ui.drawer)){let root=T.ui.modal?$('#modal-root'):$('#drawer-root'),focusable=[...root.querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled),textarea:not(:disabled),a[href]')].filter(el=>el.offsetParent!==null),first=focusable[0],last=focusable.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}}});
window.addEventListener('hashchange',()=>{T.ui.mobile=false;T.ui.selected.clear();T.render()});window.addEventListener('storage',e=>{if(e.key===T.STORAGE_KEY){T.toast('Workspace updated in another tab. Refresh to load those changes.','warning')}});T.render();if(!T.persistence)T.toast('Browser storage is unavailable. Export a backup to keep changes.','warning');
})();
</script></body></html>
